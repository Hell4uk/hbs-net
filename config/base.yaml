tokenizer:
  vocab_size: 32000
  min_frequency: 2

model:
  vocab_size: 32000
  d_model: 256
  d_state: 256
  n_layers: 6
  n_ssm_layers: 5
  n_attention_layers: 1
  n_heads: 4
  dropout: 0.1
  max_seq_len: 1024
  contradiction_beta: 0.2

training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 50
  warmup_steps: 500
  gradient_clip: 1.0
  aux_weight: 0.5
  energy_weight: 0.1
  seed: 42

checkpoint_dir: checkpoints
data_dir: data
