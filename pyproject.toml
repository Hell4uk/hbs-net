[project]
name = "hbs-net"
version = "0.1"
description = "Hybrid Belief-State Network: A Contradiction-Aware Hybrid Architecture for Compact Language Models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dependencies = ["torch>=2.4", "numpy>=1.26", "pyyaml>=6.0", "einops>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
web = ["gradio>=4.0"]
mamba = ["mamba-ssm>=2.0", "causal-conv1d>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbs"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "numpy.*", "einops.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]

[tool.coverage.run]
source = ["src/hbs"]
